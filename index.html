        #fullscreen-button {

<body>
    <div id="fullscreen-button"></div>
    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>
    <div id="rotate-message">
        <img id="rotate-gif" src="TemplateData/rotate-device.gif" alt="Please rotate your device">
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCK4jQezf4XXFkByJLbS2Awt3vHtyDl-jE",
            authDomain: "justtest-eaf59.firebaseapp.com",
            databaseURL: "https://justtest-eaf59.firebaseio.com",
            projectId: "justtest-eaf59",
            storageBucket: "justtest-eaf59.firebasestorage.app",
            messagingSenderId: "437328053649",
            appId: "437328053649:web:7e8d8f773eb13b82870630"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = app.firestore();
        
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/33c9ecb3bcdbe4d655f5cd5e8070d1bd.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/f217914c78241914d5a4db6ccd2ca447.data.br",
            frameworkUrl: buildUrl + "/dca283f07d2a8774a9cc0402bb0e8c78.framework.js.br",
            codeUrl: buildUrl + "/65ae2b1d8baa94e48ab559aee42e02de.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Quantum-Sports-Arena-Brawler",
            productVersion: "0.7.1",
            showBanner: unityShowBanner,
        };
        loadingBar.style.display = "block";
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                const interval = setInterval(() => {
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
                        clearInterval(interval);
                        const inviteCode = window.Telegram.WebApp.initDataUnsafe.start_param || "";

            });

        document.body.appendChild(script);
    </script>
    <script>
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const tg = window.Telegram.WebApp;

        function checkOrientation() {
            if (!isMobile) return;

            const isPortrait = window.innerHeight > window.innerWidth;
            const message = document.getElementById("rotate-message");
            const container = document.getElementById("unity-container");

            if (isPortrait) {
                message.style.display = "flex";
                container.style.display = "none";
            } else {
                message.style.display = "none";
                container.style.display = "block";
            }
        }

        function initializeApp() {
            if (tg) {
                tg.ready();
                if (isMobile) {
                    tg.expand();
                    if (tg.isVersionAtLeast('8.0')) {
                        tg.requestFullscreen();
                    }
                    tg.enableVerticalSwipes();
                }
            }
        }

        function toggleTelegramFullscreen() {
            if (tg && tg.isVersionAtLeast('8.0')) {
                if (tg.isFullscreen) {
                    tg.exitFullscreen();
                } else {
                    tg.requestFullscreen();
                }
            } else {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen().catch(err => { });
                }
            }
        }

        if (isMobile) {
            window.addEventListener('load', checkOrientation);
            window.addEventListener('resize', checkOrientation);
            window.addEventListener('orientationchange', checkOrientation);
        }

        const initInterval = setInterval(() => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
                clearInterval(initInterval);
                initializeApp();
            }
        }, 100);

        const fullscreenButton = document.getElementById("fullscreen-button");
        fullscreenButton.addEventListener("click", toggleTelegramFullscreen);

    </script>
</body>
</html>
