<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Quantum-Sports-Arena-Brawler</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        html, body {
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1F1F1F;
            color: white;
            font-family: sans-serif;
            font-size: 20px;
            text-align: center;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        body.portrait #orientation-warning {
            display: flex;
        }

        body.portrait #unity-container {
            display: none;
        }
    </style>
</head>
<body>
    <div id="orientation-warning">
        <div>Пожалуйста, поверните ваше устройство</div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/874c2c95269f9a45924cef85aa0c3c5c.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/2141e7dbf9f7fd6fd10448bf83f1081d.data",
        frameworkUrl: buildUrl + "/add09181dcaec87c8330b2ea2d613b1f.framework.js",
        codeUrl: buildUrl + "/113a030d3c734237350a79e351ced810.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Quantum-Sports-Arena-Brawler",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
    <script>
      function checkOrientation() {
        var isPortrait = window.innerHeight > window.innerWidth;
        if (isPortrait) {
          document.body.classList.add("portrait");
        } else {
          document.body.classList.remove("portrait");
        }
      }
      window.addEventListener("resize", checkOrientation);
      window.addEventListener("load", checkOrientation);
    </script>
</body>
</html>
