<!DOCTYPE html>
<html lang="en-us">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Quantum-Sports-Arena-Brawler</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--tg-theme-bg-color, #000);
            color: var(--tg-theme-text-color, #fff);
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
        }

        #fullscreen-button {
            position: fixed;
            top: 55px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: url('TemplateData/fullscreen-icon.png') center / contain no-repeat;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }

        #rotate-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--tg-theme-bg-color, #000);
            color: var(--tg-theme-text-color, #fff);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="fullscreen-button"></div>
    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>
    <div id="rotate-message">Пожалуйста, поверните устройство</div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/6133140d7d19c97b131d04777796d1a7.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/340b25f540ab3dd01e07631720713216.data",
            frameworkUrl: buildUrl + "/56374c057e759b41f6d4a7f8349cfbff.framework.js",
            codeUrl: buildUrl + "/90a8a2aa403eb9f2a74fc78eb31810ba.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Quantum-Sports-Arena-Brawler",
            productVersion: "0.1.0",
            showBanner: unityShowBanner,
        };
        loadingBar.style.display = "block";
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                const interval = setInterval(() => {
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
                        clearInterval(interval);
                        unityInstance.SendMessage('TelegramBridge', 'OnTelegramAPIReady');
                    }
                }, 100);
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
    <script>
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const tg = window.Telegram.WebApp;

        function checkOrientation() {
            if (!isMobile) return;

            const isPortrait = window.innerHeight > window.innerWidth;
            const message = document.getElementById("rotate-message");
            const container = document.getElementById("unity-container");

            if (isPortrait) {
                message.style.display = "flex";
                container.style.display = "none";
            } else {
                message.style.display = "block";
                if (tg && tg.isVersionAtLeast('8.0')) {
                    tg.lockOrientation();
                }
            }
        }

        function initializeApp() {
            if (tg) {
                tg.ready();
                if (isMobile) {
                    tg.expand();
                    checkOrientation();
                    if (tg.isVersionAtLeast('8.0')) {
                        tg.requestFullscreen();
                    }
                    tg.enableVerticalSwipes();
                    window.addEventListener("orientationchange", checkOrientation);
                }
            }
        }

        function toggleTelegramFullscreen() {
            if (tg && tg.isVersionAtLeast('8.0')) {
                if (tg.isFullscreen) {
                    tg.exitFullscreen();
                } else {
                    tg.requestFullscreen();
                }
            } else {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen().catch(err => { });
                }
            }
        }

        const initInterval = setInterval(() => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
                clearInterval(initInterval);
                initializeApp();
            }
        }, 100);

        const fullscreenButton = document.getElementById("fullscreen-button");
        fullscreenButton.addEventListener("click", toggleTelegramFullscreen);

    </script>
</body>
</html>
